<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дневник настроения</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Дневник настроения</h1>
    <form id="mood-form">
      <div id="mood-picker">
        <button type="button" data-mood="😢">😢</button>
        <button type="button" data-mood="😕">😕</button>
        <button type="button" data-mood="😐">😐</button>
        <button type="button" data-mood="🙂">🙂</button>
        <button type="button" data-mood="😄">😄</button>
      </div>

      <textarea id="note" placeholder="Как прошел день?" rows="3"></textarea>

      <button type="submit">Добавить запись</button>
    </form>

    <p id="empty-message">Пока пусто. Добавь первую запись!</p>
    <ul id="entries-list"></ul>

    <script src="script.js"></script>
  </body>
</html>
